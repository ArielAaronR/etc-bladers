# Finds ETC's next event on West Coast Bladers, builds the site and publishes it to
# GitHub Pages. Runs every morning, on every push to main, and on demand from the
# Actions tab ("Run workflow").
name: Find event and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 * * *' # 15:00 UTC = 8 AM Pacific in summer, 7 AM in winter
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # If WCB can't be read, keep the committed src/data/event.json and still deploy;
      # the page stops featuring an event once its start time has passed.
      - name: Find ETC's next event
        run: npm run find-event
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
